<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <noscript><p class="noscript">JavaScript is required to use this app.</p></noscript>

  <header>
    <h1>Expense &amp; Budget Visualizer</h1>
    <p>Total Balance</p>
    <p id="total-balance">$0.00</p>
  </header>

  <div id="banner" role="status"></div>

  <main>
    <section aria-labelledby="form-heading">
      <h2 id="form-heading">Add Transaction</h2>
      <form id="input-form" novalidate>
        <div class="field">
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" name="item-name" maxlength="100">
          <span class="error" id="item-name-error" aria-live="polite"></span>
        </div>

        <div class="field">
          <label for="amount">Amount</label>
          <input type="text" id="amount" name="amount" inputmode="decimal">
          <span class="error" id="amount-error" aria-live="polite"></span>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="" selected>Select a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <span class="error" id="category-error" aria-live="polite"></span>
        </div>

        <button type="submit">Add Transaction</button>
      </form>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">Transactions</h2>
      <div id="list-container" class="list-container">
        <ul id="transaction-list"></ul>
      </div>
      <p id="empty-state">No transactions recorded yet.</p>
    </section>

    <section aria-labelledby="chart-heading">
      <h2 id="chart-heading">Spending by Category</h2>
      <canvas id="spending-chart"></canvas>
      <p id="chart-message"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
